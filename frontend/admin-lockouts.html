<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lockouts · Goodlane Admin</title>
  <link rel="stylesheet" href="styles/app.css">
  <style>
    .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; background: white; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e5e0d4; text-align: left; }
    th { font-weight: 600; color: #5d6776; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
    .empty { padding: 36px; text-align: center; color: #5d6776; }
    .close-btn { padding: 6px 14px; background: #1d4ed8; color: white; border: none;
                 border-radius: 6px; font-weight: 600; cursor: pointer; }
    .reason-pill { display: inline-block; padding: 2px 10px; background: #fef3c7; color: #92400e;
                   border-radius: 999px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 style="margin:0 0 6px;">Open lockouts</h1>
    <p style="color:#5d6776;">
      Students whose accounts are paused pending identity verification (16 TAC §84.501) or clip-gate failure.
    </p>
    <div id="container"></div>
  </main>
  <script type="module">
    async function load() {
      const r = await fetch('/api/admin/lockouts', { credentials: 'include' });
      if (r.status === 403) {
        document.getElementById('container').innerHTML =
          '<p class="empty">Admin access required. Promote your account with <code>python -m backend.promote_admin &lt;email&gt;</code>.</p>';
        return;
      }
      const rows = await r.json();
      if (!rows.length) {
        document.getElementById('container').innerHTML = '<p class="empty">No open lockouts.</p>';
        return;
      }
      document.getElementById('container').innerHTML = `
        <table>
          <thead><tr><th>Email</th><th>Reason</th><th>Opened</th><th></th></tr></thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${row.email}</td>
                <td><span class="reason-pill">${row.reason}</span></td>
                <td>${row.opened_at}</td>
                <td style="text-align:right;"><button data-id="${row.id}" class="close-btn">Close</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.querySelectorAll('.close-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const notes = prompt('Close note (visible in audit log):') || '';
          const r = await fetch(`/api/admin/lockouts/${btn.dataset.id}/close`, {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notes }),
          });
          if (r.ok) load();
          else alert('Close failed: ' + r.status);
        });
      });
    }
    load();
  </script>
</body>
</html>
